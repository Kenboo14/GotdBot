services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASS:-change-me-for-local-dev}
    mem_limit: 80m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASS ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    image: ghcr.io/kenboo14/gotdbot-gateway:latest
    mem_limit: 80m
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env before starting}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ${REDIS_PASS:-change-me-for-local-dev}


      API_ID: ${API_ID:?Set API_ID in .env}
      API_HASH: ${API_HASH:?Set API_HASH in .env}
    depends_on:
      redis:
        condition: service_healthy

  ubot:
    image: ghcr.io/kenboo14/gotdbot-ubot:latest
    user: "0:0"
    mem_limit: 1250m
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env before starting}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ${REDIS_PASS:-change-me-for-local-dev}

      API_ID: ${API_ID:?Set API_ID in .env before installing a userbot}
      API_HASH: ${API_HASH:?Set API_HASH in .env before installing a userbot}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Set SESSION_ENCRYPTION_KEY in .env}

      SQLITE_PATH: ${SQLITE_PATH:-/app/data/userbot.db}
      MONGO_BACKUP_URI: ${MONGO_BACKUP_URI:-}
      MONGO_BACKUP_DB: ${MONGO_BACKUP_DB:-gotdbot_backup}

      GROUP_CACHE: ${GROUP_CACHE:-AiotdCaches}
      NOTES_CACHE: ${NOTES_CACHE:-7157}

      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-550}
      GOMEMLIMIT: ${GOMEMLIMIT:-1100MiB}
      GOGC: ${GOGC:-50}
    volumes:
      - ubot_data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  ubot_data:
