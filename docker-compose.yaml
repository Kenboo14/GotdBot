services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASS:-change-me-for-local-dev}
    mem_limit: 80m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASS ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: ghcr.io/kenboo14/gotdbot-gateway:latest
    restart: unless-stopped
    user: "0:0"
    mem_limit: 80m
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env before starting}
      OWNER: ${OWNER:-}
      OWNER_ID: ${OWNER_ID:-${OWNER:-}}
      API_ID: ${API_ID:?Set API_ID in .env before starting gateway}
      API_HASH: ${API_HASH:?Set API_HASH in .env before starting gateway}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ${REDIS_PASS:-change-me-for-local-dev}
      MONGO_URI: ${MONGO_URI:-${MONGO_BACKUP_URI:-}}
      MONGO_DB: ${MONGO_DB:-${MONGO_BACKUP_DB:-gotdbot}}
      SQLITE_PATH: /app/data/userbot.db
      GROUP_DEV: ${GROUP_DEV:-}
      MONITOR_TOPIC: ${MONITOR_TOPIC:-}
      MONITOR_USERBOT_CONNECTED: ${MONITOR_USERBOT_CONNECTED:-}
      MONITOR_TOKEN_COLLECTED: ${MONITOR_TOKEN_COLLECTED:-}
      MONITOR_USER_START: ${MONITOR_USER_START:-}
      MONITOR_TOKEN_EXPIRED: ${MONITOR_TOKEN_EXPIRED:-}
      MONITOR_BACKUP_TOKEN: ${MONITOR_BACKUP_TOKEN:-}
      MONITOR_BOT_LOADER: ${MONITOR_BOT_LOADER:-}
      MONITOR_TOKEN_CREATED: ${MONITOR_TOKEN_CREATED:-}
      MONITOR_SESSION_TRACK: ${MONITOR_SESSION_TRACK:-}
      MONITOR_TRACEBACK: ${MONITOR_TRACEBACK:-}
      MONITOR_INVOICE: ${MONITOR_INVOICE:-}
      MONITOR_DATABASE: ${MONITOR_DATABASE:-}
      GROUP_CACHE: ${GROUP_CACHE:-AiotdCaches}
      GOMEMLIMIT: ${GOMEMLIMIT:-700MiB}
      GOGC: ${GOGC:-30}
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

    depends_on:
      redis:
        condition: service_healthy

  ubot:
    build:
      context: ./ubot
      dockerfile: Dockerfile
    image: ghcr.io/kenboo14/gotdbot-ubot:latest
    restart: unless-stopped
    user: "0:0"
    mem_limit: 1250m
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env before starting}
      OWNER: ${OWNER:-}
      OWNER_ID: ${OWNER_ID:-${OWNER:-}}
      LOGBOT_TOKEN: ${LOGBOT_TOKEN:-}
      REDIS_ADDR: redis:6379
      REDIS_PASS: ${REDIS_PASS:-change-me-for-local-dev}

      API_ID: ${API_ID:?Set API_ID in .env before installing a userbot}
      API_HASH: ${API_HASH:?Set API_HASH in .env before installing a userbot}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?Set SESSION_ENCRYPTION_KEY in .env}

      SQLITE_PATH: /app/data/userbot.db
      MONGO_BACKUP_URI: ${MONGO_BACKUP_URI:-}
      MONGO_BACKUP_DB: ${MONGO_BACKUP_DB:-gotdbot_backup}

      GROUP_CACHE: ${GROUP_CACHE:-AiotdCaches}
      NOTES_CACHE: ${NOTES_CACHE:-7157}
      TEKS_CACHE: ${TEKS_CACHE:-3325}
      TOPIC_CACHE: ${TOPIC_CACHE:-}
      WATERMARK_CACHE: ${WATERMARK_CACHE:-6847}
      SESSION_CACHE: ${SESSION_CACHE:-7073}
      IMGBB_API_KEY: ${IMGBB_API_KEY:-}

      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-300}
      SESSION_HEARTBEAT_SECONDS: ${SESSION_HEARTBEAT_SECONDS:-60}
      GOMEMLIMIT: ${GOMEMLIMIT:-700MiB}
      GOGC: ${GOGC:-30}
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
